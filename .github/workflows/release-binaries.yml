name: Release Binaries

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write  # upload assets to the GitHub Release
    strategy:
      matrix:
        include:
          - target: linux-x64
            os: ubuntu-latest
            bun_target: bun-linux-x64
          - target: linux-arm64
            os: ubuntu-latest
            bun_target: bun-linux-arm64
          - target: darwin-x64
            os: macos-latest
            bun_target: bun-darwin-x64
          - target: darwin-arm64
            os: macos-latest
            bun_target: bun-darwin-arm64
          - target: win-x64
            os: windows-latest
            bun_target: bun-windows-x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          no-cache: true
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          # No dependency cache when building release artifacts (cache-poisoning hardening).
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:core
      - run: pnpm build:cli

      - name: Compile standalone binary
        shell: bash  # same "$BUN_TARGET" syntax on the Windows runner
        env:
          BUN_TARGET: ${{ matrix.bun_target }}
        run: bun build packages/cli/dist/index.js --compile --target="$BUN_TARGET" --outfile tokx

      - name: Package (Unix)
        if: runner.os != 'Windows'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          chmod +x tokx
          tar czf "tokx-${TARGET}.tar.gz" tokx
          shasum -a 256 "tokx-${TARGET}.tar.gz" > "tokx-${TARGET}.tar.gz.sha256"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          Compress-Archive -Path tokx.exe -DestinationPath "tokx-$env:TARGET.zip"
          (Get-FileHash "tokx-$env:TARGET.zip" -Algorithm SHA256).Hash | Out-File "tokx-$env:TARGET.zip.sha256"

      - name: Upload to Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            tokx-${{ matrix.target }}.*
